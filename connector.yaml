connector:
  url: https://dummyjson.com/products
  records_path: products
  schema:
    id: int64
    title: string
    price: float64
    category: string
    stock: int64
  pagination:
    type: offset
    offset_param: skip
    limit_param: limit
    page_size: 10
    total_path: total

merge: replace

target:
  path: ./output/products.parquet

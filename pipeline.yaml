connector:
  type: rest
  url: https://dummyjson.com/products
  records_path: products
  schema:
    id: int64
    title: string
    price: float64
    category: string
    stock: int64
  schema_policy: strict
  pagination:
    type: offset
    offset_param: skip
    limit_param: limit
    page_size: 10
    total_path: total
  request:
    timeout_seconds: 30
    retries: 3
    backoff_seconds: 1

merge: replace

target:
  type: parquet
  path: ./output/products.parquet
